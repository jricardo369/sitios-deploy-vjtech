name: sitios

# Dos sitios estaticos detras de un reverse proxy en el puerto 80:
#   http://<EC2>/thunder-team/  -> servicio thunder (repo sitio-team-thunder)
#   http://<EC2>/vj-tech/       -> servicio vjtech  (repo landing-page-vjtech)
# Los servicios solo exponen el puerto 80 en la red interna de docker;
# unicamente el proxy publica el 80 del host.

services:
  thunder:
    build: ./sitio-team-thunder
    restart: unless-stopped
    expose:
      - "80"

  vjtech:
    build: ./landing-page-vjtech
    restart: unless-stopped
    expose:
      - "80"

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - thunder
      - vjtech
