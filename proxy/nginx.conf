# Reverse proxy: puerto 80 del host -> sitios por ruta.
# El rewrite recorta el prefijo antes de enviar la peticion al contenedor
# (ej: /vj-tech/styles.css -> /styles.css).
# Funciona porque los sitios usan rutas relativas de assets y la SPA de
# app-gastos se compila con --base-href /app-gastos/ (ver su Dockerfile).
# NOTA: los upstreams se resuelven POR PETICION via el DNS interno de docker
# (127.0.0.11) usando variables + rewrite, para que nginx NO falle al arrancar
# si un contenedor aun no esta listo (evita el crash-loop del proxy).
server {
    listen       80;
    server_name  _;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # DNS interno de docker: resolucion por peticion (no al arrancar nginx)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Prefijos sin slash final -> redirigir a /prefijo/
    location = /thunder-team { return 301 /thunder-team/; }
    location = /vj-tech      { return 301 /vj-tech/; }
    location = /app-gastos   { return 301 /app-gastos/; }

    location /thunder-team/ {
        set $upstream_thunder http://thunder:80;
        rewrite ^/thunder-team/(.*)$ /$1 break;
        proxy_pass $upstream_thunder;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /vj-tech/ {
        set $upstream_vjtech http://vjtech:80;
        rewrite ^/vj-tech/(.*)$ /$1 break;
        proxy_pass $upstream_vjtech;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /app-gastos/ {
        set $upstream_gastos http://gastos:80;
        rewrite ^/app-gastos/(.*)$ /$1 break;
        proxy_pass $upstream_gastos;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Raiz: indice minimo con los links a los sitios
    location = / {
        add_header Content-Type text/html;
        return 200 '<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Sitios</title></head><body><h1>Sitios</h1><ul><li><a href="/thunder-team/">Team Thunder</a></li><li><a href="/vj-tech/">VJ Tech</a></li><li><a href="/app-gastos/">App Gastos</a></li></ul></body></html>';
    }

    location / { return 404; }
}
