# Reverse proxy: puerto 80 del host -> sitios por ruta.
# El rewrite recorta el prefijo antes de enviar la peticion al contenedor
# (ej: /vj-tech/styles.css -> /styles.css).
# Funciona porque ambos sitios usan rutas relativas de assets.
# NOTA: los upstreams se resuelven POR PETICION via el DNS interno de docker
# (127.0.0.11) usando variables + rewrite, para que nginx NO falle al arrancar
# si un contenedor aun no esta listo (evita el crash-loop del proxy).
server {
    listen       80;
    server_name  _;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # DNS interno de docker: resolucion por peticion (no al arrancar nginx)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # /thunder-team sin slash -> redirigir a /thunder-team/
    location = /thunder-team { return 301 /thunder-team/; }
    location = /vj-tech      { return 301 /vj-tech/; }

    location /thunder-team/ {
        rewrite ^/thunder-team/(.*)$ /$1 break;
        set $upstream_thunder http://thunder:80;
        proxy_pass $upstream_thunder;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /vj-tech/ {
        rewrite ^/vj-tech/(.*)$ /$1 break;
        set $upstream_vjtech http://vjtech:80;
        proxy_pass $upstream_vjtech;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Raiz: indice minimo con los links a ambos sitios
    location = / {
        add_header Content-Type text/html;
        return 200 '<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Sitios</title></head><body><h1>Sitios</h1><ul><li><a href="/thunder-team/">Team Thunder</a></li><li><a href="/vj-tech/">VJ Tech</a></li></ul></body></html>';
    }

    location / { return 404; }
}
