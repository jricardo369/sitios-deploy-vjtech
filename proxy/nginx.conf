# Reverse proxy: puerto 80 del host -> sitios por ruta.
# El "/" final en cada proxy_pass recorta el prefijo antes de enviar
# la peticion al contenedor (ej: /vj-tech/styles.css -> /styles.css).
# Funciona porque ambos sitios usan rutas relativas de assets.
server {
    listen       80;
    server_name  _;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # /thunder-team sin slash -> redirigir a /thunder-team/
    location = /thunder-team { return 301 /thunder-team/; }
    location = /vj-tech      { return 301 /vj-tech/; }

    location /thunder-team/ {
        proxy_pass http://thunder:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /vj-tech/ {
        proxy_pass http://vjtech:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Raiz: indice minimo con los links a ambos sitios
    location = / {
        add_header Content-Type text/html;
        return 200 '<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Sitios</title></head><body><h1>Sitios</h1><ul><li><a href="/thunder-team/">Team Thunder</a></li><li><a href="/vj-tech/">VJ Tech</a></li></ul></body></html>';
    }

    location / { return 404; }
}
